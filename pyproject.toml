[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-contrataciones-py"
version = "0.1.0"
description = "MCP server para la API de contrataciones públicas de Paraguay (DNCP v3, formato OCDS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Easy Soluciones" }]
keywords = ["mcp", "dncp", "paraguay", "contrataciones", "ocds", "open-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.9.0,<2",  # v1: API FastMCP estable (v2 renombró FastMCP a MCPServer)
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
mcp-contrataciones = "mcp_dncp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
